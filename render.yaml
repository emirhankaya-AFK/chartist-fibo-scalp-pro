services:
  - type: web
    name: chartist-fibo-scalp-pro
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NTFY_TOPIC
        value: emirkan_bist_alarm
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_ULTRA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_SUPER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
