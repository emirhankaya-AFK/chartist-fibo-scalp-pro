services:
  - type: web
    name: chartist-fibo-scalp-pro
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --max-requests 500 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NTFY_TOPIC
        value: emirkan_bist_alarm
      - key: OPPORTUNITY_INTERVAL_SECONDS
        value: "60"
      - key: SUMMARY_GRACE_MINUTES
        value: "10"
      - key: COMMODITY_SPIKE_PCT
        value: "0.50"
      - key: ANALYST_PROXIMITY_PCT
        value: "0.75"
      - key: SEND_INDIVIDUAL_OPPORTUNITY_ALERTS
        value: "0"
      - key: ENABLE_TELEGRAM_NOTIFICATIONS
        value: "0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_ULTRA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_SUPER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
